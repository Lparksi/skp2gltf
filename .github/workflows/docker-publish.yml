name: Docker Publish

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-windows-binary:
    name: Build Windows Binary
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (CMake)
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build (Release)
        run: cmake --build build --config Release --parallel

      - name: Stage Docker Binaries
        shell: pwsh
        run: |
          $binDir = "docker-bin"
          New-Item -ItemType Directory -Path $binDir -Force | Out-Null
          
          # Copy our build results
          Copy-Item build/Release/*.exe $binDir/
          Copy-Item build/Release/*.dll $binDir/
          
          # IMPORTANT: SketchUp SDK depends on MSVC Runtime DLLs.
          # We need to collect them from the runner to bundle into the Docker image.
          $sys32 = "C:\Windows\System32"
          $msvcDlls = @("vcruntime140.dll", "msvcp140.dll", "msvcp140_1.dll", "msvcp140_2.dll", "msvcp140_codecvt_ids.dll")
          foreach ($dll in $msvcDlls) {
            if (Test-Path "$sys32\$dll") {
              Write-Host "Copying $dll from system32..."
              Copy-Item "$sys32\$dll" $binDir/
            }
          }

      - name: Upload Docker Binaries
        uses: actions/upload-artifact@v4
        with:
          name: docker-bin
          if-no-files-found: error
          path: docker-bin/*

  build-and-push-images:
    name: Build and Push Images
    needs: build-windows-binary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Docker Binaries
        uses: actions/download-artifact@v4
        with:
          name: docker-bin
          path: docker-bin

      - name: Verify Docker Context
        run: ls -lah docker-bin

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
