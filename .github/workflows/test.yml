name: Multi-Platform Test

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  # 1. Windows 构建
  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache CMake Build
        uses: actions/cache@v4
        with:
          path: build
          key: ${{ runner.os }}-cmake-${{ hashFiles('**/CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cmake-${{ hashFiles('**/CMakeLists.txt') }}-
            ${{ runner.os }}-cmake-

      - name: Configure (CMake)
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build (Release)
        run: cmake --build build --config Release --parallel

      - name: Prepare Binaries for Testing & Docker
        shell: pwsh
        run: |
          $binDir = "docker-bin"
          New-Item -ItemType Directory -Path $binDir -Force | Out-Null
          
          # Copy build results
          Copy-Item build/Release/*.exe $binDir/
          Copy-Item build/Release/*.dll $binDir/
          
          # IMPORTANT: SketchUp SDK depends on MSVC Runtime DLLs.
          # We collect them from the runner to bundle into the Docker image.
          $sys32 = "C:\Windows\System32"
          $msvcDlls = @("vcruntime140.dll", "msvcp140.dll", "msvcp140_1.dll", "msvcp140_2.dll", "msvcp140_codecvt_ids.dll")
          foreach ($dll in $msvcDlls) {
            if (Test-Path "$sys32\$dll") {
              Write-Host "Copying $dll from system32..."
              Copy-Item "$sys32\$dll" $binDir/
            }
          }

      - name: Upload Binaries (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: docker-bin/*
          if-no-files-found: error

  # 2. Windows 原生测试
  test-native-windows:
    name: Native Test (Windows)
    needs: build-windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Binaries
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: bin

      - name: Run Native Test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path "output" | Out-Null
          
          Write-Host "Starting conversion test..."
          # Note: test/test_model.skp should be available from checkout
          & "bin/skp2gltf.exe" "test/test_model.skp" "output" "result" "glb"
          
          if ($LASTEXITCODE -ne 0) {
            throw "Native conversion failed with exit code $LASTEXITCODE"
          }
          
          if (-not (Test-Path "output/result.glb")) {
            throw "Output file output/result.glb not found!"
          }
          
          $fileInfo = Get-Item "output/result.glb"
          Write-Host "Test Passed! Output size: $($fileInfo.Length) bytes."

  # 3. 并行构建 Docker 镜像 (amd64 & arm64 在不同机器上同时跑)
  build-docker-image:
    name: Build Docker (${{ matrix.arch }})
    needs: build-windows
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    outputs:
      # 我们需要将 tag 传递给下游，注意这里的 tag 会带有 arch 后缀
      image_tag_amd64: ${{ steps.image_info.outputs.tag }}-amd64
      image_tag_arm64: ${{ steps.image_info.outputs.tag }}-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Binaries
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: docker-bin

      - name: Set up QEMU
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Repo Lowercase and Tag
        id: image_info
        run: |
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          TAG="ghcr.io/${REPO_LC}:test-${{ github.sha }}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.${{ matrix.arch }}
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ steps.image_info.outputs.tag }}-${{ matrix.arch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 4. 各平台 Docker 测试 (解耦依赖，谁好了谁跑)
  test-docker-multiplatform:
    name: Docker Test (${{ matrix.name }})
    needs: build-docker-image
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
            arch: amd64
            name: Linux-x64
          - os: macos-13
            platform: linux/amd64
            arch: amd64
            name: MacOS-x64
          - os: macos-14
            platform: linux/arm64
            arch: arm64
            name: MacOS-arm64
          - os: macos-latest
            platform: linux/arm64
            arch: arm64
            name: MacOS-latest-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker (macOS only)
        if: runner.os == 'macOS'
        uses: docker-practice/actions-setup-docker@v1
        timeout-minutes: 20

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Test in Docker
        run: |
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG="ghcr.io/${REPO_LC}:test-${{ github.sha }}-${{ matrix.arch }}"
          
          mkdir -p output
          docker run --rm \
            -v "${PWD}:/work" \
            ${IMAGE_TAG} \
            /work/test/test_model.skp /work/output result glb

      - name: Verify Output
        run: |
          if [ ! -f "output/result.glb" ]; then
            echo "Error: output/result.glb was not generated."
            exit 1
          fi
          ls -lh output/result.glb

  # 5. 发布正式镜像 (仅在 main 分支推送到 latest)
  publish-final:
    name: Publish Final Image
    needs: test-docker-multiplatform
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Repo Lowercase
        id: image_info
        run: |
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "repo=${REPO_LC}" >> $GITHUB_OUTPUT

      - name: Tag and Push Final
        run: |
          REPO="ghcr.io/${{ steps.image_info.outputs.repo }}"
          TEST_TAG="${REPO}:test-${{ github.sha }}"
          
          # Push both architecture tags to latest
          docker buildx imagetools create --tag ${REPO}:latest-amd64 ${TEST_TAG}-amd64
          docker buildx imagetools create --tag ${REPO}:latest-arm64 ${TEST_TAG}-arm64
          
          # Optional: create a consolidated 'latest' manifest if you still want it
          docker buildx imagetools create --tag ${REPO}:latest ${TEST_TAG}-amd64 ${TEST_TAG}-arm64
          
          # Version tags
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VER="${{ github.ref_name }}"
            docker buildx imagetools create --tag ${REPO}:${VER}-amd64 ${TEST_TAG}-amd64
            docker buildx imagetools create --tag ${REPO}:${VER}-arm64 ${TEST_TAG}-arm64
            docker buildx imagetools create --tag ${REPO}:${VER} ${TEST_TAG}-amd64 ${TEST_TAG}-arm64
          fi

