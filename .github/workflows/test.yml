name: Multi-Platform Test

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
      - 'docs/**'

# 并发控制：如果同一个分支有新的提交，自动取消旧的运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # 1. Windows 构建
  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache CMake Build
        uses: actions/cache@v4
        with:
          path: build
          key: ${{ runner.os }}-cmake-${{ hashFiles('**/CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cmake-${{ hashFiles('**/CMakeLists.txt') }}-
            ${{ runner.os }}-cmake-

      - name: Configure (CMake)
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build (Release)
        run: cmake --build build --config Release --parallel

      - name: Prepare Binaries for Testing & Docker
        shell: pwsh
        run: |
          $binDir = "docker-bin"
          New-Item -ItemType Directory -Path $binDir -Force | Out-Null
          
          # Copy build results
          Copy-Item build/Release/*.exe $binDir/
          Copy-Item build/Release/*.dll $binDir/
          
          # IMPORTANT: SketchUp SDK depends on MSVC Runtime DLLs.
          # We collect them from the runner to bundle into the Docker image.
          $sys32 = "C:\Windows\System32"
          $msvcDlls = @("vcruntime140.dll", "msvcp140.dll", "msvcp140_1.dll", "msvcp140_2.dll", "msvcp140_codecvt_ids.dll")
          foreach ($dll in $msvcDlls) {
            if (Test-Path "$sys32\$dll") {
              Write-Host "Copying $dll from system32..."
              Copy-Item "$sys32\$dll" $binDir/
            }
          }

      - name: Upload Binaries (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: docker-bin/*
          if-no-files-found: error

  # 2. Windows 原生测试
  test-native-windows:
    name: Native Test (Windows)
    needs: build-windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Binaries
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: bin

      - name: Run Native Test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path "output" | Out-Null
          
          Write-Host "Starting conversion test..."
          # Note: test/test_model.skp should be available from checkout
          & "bin/skp2gltf.exe" "test/test_model.skp" "output" "result" "glb"
          
          if ($LASTEXITCODE -ne 0) {
            throw "Native conversion failed with exit code $LASTEXITCODE"
          }
          
          if (-not (Test-Path "output/result.glb")) {
            throw "Output file output/result.glb not found!"
          }
          
          $fileInfo = Get-Item "output/result.glb"
          Write-Host "Test Passed! Output size: $($fileInfo.Length) bytes."

  # 3. 构建 Docker 镜像 (AMD64)
  build-docker-amd64:
    name: Build Docker (amd64)
    needs: build-windows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.image_info.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download Binaries
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: docker-bin
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image_info
        run: |
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          TAG="ghcr.io/${REPO_LC}:test-${{ github.sha }}-amd64"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
      - name: Build and Push (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.amd64
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image_info.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 4. 测试 Docker 镜像 (AMD64) - 构建完立即开始
  test-docker-amd64:
    name: Test Docker (amd64)
    needs: build-docker-amd64
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup UV
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Run Test (CLI Mode)
        run: |
          mkdir -p output
          docker run --rm -v "${PWD}:/work" ${{ needs.build-docker-amd64.outputs.tag }} \
            /work/test/test_model.skp /work/output result glb
      - name: Run Test (API Mode)
        run: |
          echo "::group::Starting API Container"
          docker run -d --name skp_api -p 8000:8000 -v "${PWD}:/work" ${{ needs.build-docker-amd64.outputs.tag }}
          echo "::endgroup::"
          echo "::group::Setup Test Environment"
          uv pip install httpx pytest pytest-asyncio
          echo "::endgroup::"
          echo "::group::Waiting for API"
          # Manually loop to handle code 56/7 etc.
          MAX_RETRIES=45
          COUNT=0
          until curl --output /dev/null --silent --show-error --fail http://localhost:8000/health; do
            COUNT=$((COUNT+1))
            if [ $COUNT -ge $MAX_RETRIES ]; then
              echo "API failed to become ready after $MAX_RETRIES attempts"
              docker logs skp_api
              exit 1
            fi
            sleep 2
          done
          echo "::endgroup::"
          export API_URL="http://localhost:8000"
          uv run pytest -v -o asyncio_mode=auto tests/test_api.py || (docker logs skp_api && exit 1)
          docker stop skp_api && docker rm skp_api

  # 5. 构建 Docker 镜像 (ARM64)
  build-docker-arm64:
    name: Build Docker (arm64)
    needs: build-windows
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      tag: ${{ steps.image_info.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download Binaries
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: docker-bin
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image_info
        run: |
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          TAG="ghcr.io/${REPO_LC}:test-${{ github.sha }}-arm64"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
      - name: Build and Push (arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.arm64
          platforms: linux/arm64
          push: true
          tags: ${{ steps.image_info.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 6. 测试 Docker 镜像 (ARM64)
  test-docker-arm64:
    name: Test Docker (arm64)
    needs: build-docker-arm64
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup UV
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Run Test (CLI Mode)
        run: |
          mkdir -p output
          docker run --rm --platform linux/arm64 -v "${PWD}:/work" ${{ needs.build-docker-arm64.outputs.tag }} \
            /work/test/test_model.skp /work/output result glb
      - name: Run Test (API Mode)
        run: |
          echo "::group::Starting API Container"
          docker run -d --name skp_api --platform linux/arm64 -p 8000:8000 -v "${PWD}:/work" ${{ needs.build-docker-arm64.outputs.tag }}
          echo "::endgroup::"
          echo "::group::Setup Test Environment"
          uv pip install httpx pytest pytest-asyncio
          echo "::endgroup::"
          echo "::group::Waiting for API"
          # Manually loop to handle code 56/7 etc.
          MAX_RETRIES=45
          COUNT=0
          until curl --output /dev/null --silent --show-error --fail http://localhost:8000/health; do
            COUNT=$((COUNT+1))
            if [ $COUNT -ge $MAX_RETRIES ]; then
              echo "API failed to become ready after $MAX_RETRIES attempts"
              docker logs skp_api
              exit 1
            fi
            sleep 2
          done
          echo "::endgroup::"
          export API_URL="http://localhost:8000"
          uv run pytest -v -o asyncio_mode=auto tests/test_api.py || (docker logs skp_api && exit 1)
          docker stop skp_api && docker rm skp_api

  # 7. 发布正式镜像 (仅在 main 或 tag 时)
  publish-final:
    name: Publish Final Image
    needs: [test-docker-amd64, test-docker-arm64]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Get Repo Info
        id: info
        run: |
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "repo=ghcr.io/${REPO_LC}" >> $GITHUB_OUTPUT
      - name: Tag and Push Final
        run: |
          REPO="${{ steps.info.outputs.repo }}"
          TEST_AMD64="${REPO}:test-${{ github.sha }}-amd64"
          TEST_ARM64="${REPO}:test-${{ github.sha }}-arm64"
          
          # 创建并推送合并后的 multi-arch manifest
          docker buildx imagetools create --tag ${REPO}:latest ${TEST_AMD64} ${TEST_ARM64}
          
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VER="${{ github.ref_name }}"
            docker buildx imagetools create --tag ${REPO}:${VER} ${TEST_AMD64} ${TEST_ARM64}
          fi

  # 8. 创建 GitHub Release
  create-release:
    name: Create GitHub Release
    needs: [build-windows, test-docker-amd64, test-docker-arm64]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download Windows Binaries
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: bin
      - name: Archive Binaries
        run: |
          cd bin && zip -r ../skp2gltf-win-x64.zip .
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: skp2gltf-win-x64.zip
          body: |
            ## Docker Image
            `docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}`
            
            Platforms: `linux/amd64`, `linux/arm64`
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}

