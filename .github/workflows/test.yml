name: Functionality Test

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  test-conversion:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (CMake)
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build (Release)
        run: cmake --build build --config Release --parallel

      - name: Download Test Model
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://file.parksi.cc/Dining%2BChair_251002.skp" -OutFile "test_model.skp"

      - name: Run Conversion Test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseDir = "build/Release"
          
          # Create output directory
          New-Item -ItemType Directory -Force -Path "output" | Out-Null
          
          # Run the skp2gltf binary
          Write-Host "Starting conversion..."
          & "$releaseDir/skp2gltf.exe" "test_model.skp" "output" "result" "glb"
          
          if ($LASTEXITCODE -ne 0) {
            throw "Conversion utility failed with exit code $LASTEXITCODE"
          }
          
          # Verify that result.glb exists
          if (-not (Test-Path "output/result.glb")) {
            throw "Conversion command succeeded but output/result.glb was not found!"
          }
          
          $fileInfo = Get-Item "output/result.glb"
          Write-Host "Test Passed! Output file size: $($fileInfo.Length) bytes."

      - name: Stage Docker Binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path docker-bin -Force | Out-Null
          Copy-Item build/Release/skp2gltf.exe docker-bin/
          Copy-Item build/Release/SketchUpAPI.dll docker-bin/
          Copy-Item build/Release/SketchUpCommonPreferences.dll docker-bin/

      - name: Upload Docker Binaries for Docker Test
        uses: actions/upload-artifact@v4
        with:
          name: docker-bin-test
          if-no-files-found: error
          path: docker-bin/*

  test-docker:
    runs-on: ubuntu-latest
    needs: test-conversion

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Docker Binaries
        uses: actions/download-artifact@v4
        with:
          name: docker-bin-test
          path: docker-bin

      - name: Build local Docker image
        run: docker build -t skp2gltf-test .

      - name: Download Test Model
        run: wget -O test_model.skp "https://file.parksi.cc/Dining%2BChair_251002.skp"

      - name: Prepare Output Directory
        run: mkdir -p output

      - name: Run Conversion in Docker
        run: |
          docker run --rm \
            -e WINEDLLOVERRIDES="mscoree,mshtml=" \
            -v "${PWD}:/work" \
            skp2gltf-test \
            /work/test_model.skp /work/output result glb

      - name: Verify Docker Output
        run: |
          if [ ! -f "output/result.glb" ]; then
            echo "Error: output/result.glb was not generated by Docker container."
            exit 1
          fi
          echo "Docker test conversion successful!"
          ls -lh output/result.glb
